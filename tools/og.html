<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@500;600&display=block" rel="stylesheet">
<style>

  <div class="tag">ساجلني بالشعر إن استطعت</div>
  <div class="verse"><span>وَإِنَّ أَشعَرَ بَيتٍ أَنتَ قائِلُهُ</span><span>بَيتٌ يُقالُ إِذا أَنشَدتَهُ صَدَقا</span></div>
